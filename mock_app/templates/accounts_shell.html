<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Search — First National CU</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; }
    .header { background: #003366; color: #fff; padding: 10px 20px; display: flex; align-items: center; }
    .header h1 { margin: 0; font-size: 1.1em; }
    .nav { background: #0055a5; padding: 4px 20px; }
    .nav a { color: #cde; text-decoration: none; font-size: 0.85em; margin-right: 16px; }
    .content { padding: 20px; }
    /* The account search lives entirely inside an iframe */
    .search-frame { width: 100%; height: 520px; border: 1px solid #bbb; background: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>First National Credit Union &mdash; Back Office</h1>
  </div>
  <div class="nav">
    <a href="/accounts">Member Accounts</a>
    <a href="#">Loans</a>
    <a href="#">Reports</a>
  </div>
  <div class="content">
    <iframe class="search-frame" name="account-search" src="/accounts/frame" title="Account Search"></iframe>
  </div>
</body>
</html>
