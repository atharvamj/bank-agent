<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error — First National CU</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; }
    .header { background: #003366; color: #fff; padding: 10px 20px; }
    .header h1 { margin: 0; font-size: 1.1em; }
    .content { padding: 24px 20px; }
    .error-box { background: #fff; border: 2px solid #c00; padding: 20px 24px; max-width: 420px; }
    .error-box h2 { color: #c00; margin-top: 0; }
    .back-link { display: block; margin-top: 14px; font-size: 0.85em; color: #003366; }
  </style>
</head>
<body>
  <div class="header">
    <h1>First National Credit Union &mdash; Error</h1>
  </div>
  <div class="content">
    <div class="error-box">
      <h2>Error</h2>
      <p>{{ message }}</p>
    </div>
    <a class="back-link" href="/accounts">&larr; Back</a>
  </div>
</body>
</html>
